# =============================================================================
# SHARED CONFIGURATION - served by the Config Server to ALL microservices
# (UserManagement, ProductManagement, InventoryManagement, DeliveryManagement)
#
# IMPORTANT: do NOT put spring.application.name in this file.
# Remote properties override local ones, so it would rename every service.
# Each service keeps its own name in its LOCAL application.properties.
# =============================================================================

# ---- Port per service (looked up by spring.application.name) ----------------
app.ports.UserManagement=8081
app.ports.ProductManagement=8082
app.ports.InventoryManagement=8083
app.ports.DeliveryManagement=8084
server.port=${app.ports.${spring.application.name}}

# ---- Database ---------------------------------------------------------------
spring.datasource.username=root
spring.datasource.url=jdbc:mysql://localhost:3306/microservices
spring.datasource.password=root
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# ---- JPA --------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---- Eureka -----------------------------------------------------------------
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}